name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libpng-dev qtbase5-dev imagemagick
      - run: make all
      # the batch is headless: feed it four copies of a generated test image
      - run: |
          mkdir -p /tmp/run && cd /tmp/run
          convert rose: -resize 256x256! PNG24:base.png
          for n in camahorizontal camavertical cama45p cama45n; do cp base.png $n.png; done
          "$GITHUB_WORKSPACE/procimg" && ls -l sumlena.png
